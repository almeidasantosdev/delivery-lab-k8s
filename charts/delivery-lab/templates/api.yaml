{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "delivery-lab.labels" (dict "component" "api" "root" .) | nindent 4 }}
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "delivery-lab.selectorLabels" (dict "component" "api" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "delivery-lab.labels" (dict "component" "api" "root" .) | nindent 8 }}
      annotations:
        checksum/database: {{ printf "%s:%s:%s" .Values.postgres.user .Values.postgres.password .Values.postgres.database | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "delivery-lab.podSecurity" . | nindent 8 }}
        # A imagem declara USER node. O Kubernetes so aceita runAsNonRoot com uid numerico.
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        {{- include "delivery-lab.wait" (dict "image" (include "delivery-lab.appImage" .) "pullPolicy" .Values.image.pullPolicy "targets" "postgres:5432") | nindent 8 }}
      containers:
        - name: api
          image: {{ include "delivery-lab.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.api.command | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database
                  key: DATABASE_URL
            {{- range .Values.api.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "delivery-lab.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "delivery-lab.labels" (dict "component" "api" "root" .) | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "delivery-lab.selectorLabels" (dict "component" "api" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
{{- end }}
