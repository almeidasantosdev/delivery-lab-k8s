{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: database
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "delivery-lab.labels" (dict "component" "database" "root" .) | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@postgres:5432/%s" (.Values.postgres.user | urlquery) (.Values.postgres.password | urlquery) (.Values.postgres.database | urlquery) | quote }}
{{- end }}
