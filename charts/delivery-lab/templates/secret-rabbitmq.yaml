{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "delivery-lab.labels" (dict "component" "rabbitmq" "root" .) | nindent 4 }}
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: {{ .Values.rabbitmq.user | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.rabbitmq.password | quote }}
  RABBITMQ_URL: {{ printf "amqp://%s:%s@rabbitmq:5672" (.Values.rabbitmq.user | urlquery) (.Values.rabbitmq.password | urlquery) | quote }}
{{- end }}
