apiVersion: v1
kind: Secret
metadata:
  name: database
  namespace: delivery
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/part-of: delivery-lab
type: Opaque
stringData:
  POSTGRES_USER: delivery
  POSTGRES_PASSWORD: delivery
  POSTGRES_DB: delivery
  DATABASE_URL: postgres://delivery:delivery@postgres:5432/delivery
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  namespace: delivery
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: delivery-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: delivery
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: delivery-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: delivery-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: database
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: database
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - delivery
                - -d
                - delivery
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - delivery
                - -d
                - delivery
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: delivery
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: delivery-lab
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
